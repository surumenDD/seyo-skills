<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif">
  <title id="t">作業のスキル、二つの層、利用者の指摘の図鑑のつながり</title>
  <desc id="d">slide-seyo と delegate-seyo は、文章を書くときに、まず二つの層（ronjutsu-seyo：論述の層、buntai-seyo：文体の層）を読む。層は誰にとっても同じで、このリポジトリにある。次に、利用者の PC の ~/.seyo/ にある指摘の図鑑を、共通、引き継ぐプロジェクト、いまのプロジェクトの順に読む。図鑑は公開しない。chosei-seyo は会話の指摘から登録の案を示し、利用者が了承したら、いまのプロジェクトの図鑑に登録する。</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  </defs>
  <!-- このリポジトリ（公開）: 作業のスキル -->
  <rect x="16" y="16" width="168" height="130" rx="3" fill="#0072B2" fill-opacity="0.07" stroke="#0072B2" stroke-width="1.5"/>
  <text x="32" y="46" font-size="18" font-weight="700" fill="#1E1E1E">作業のスキル</text>
  <text x="32" y="86" font-size="17" fill="#1E1E1E">slide-seyo</text>
  <text x="32" y="118" font-size="17" fill="#1E1E1E">delegate-seyo</text>
  <path d="M184,81 L252,81" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="218" y="70" font-size="17" text-anchor="middle" fill="#1E1E1E">① 読む</text>
  <!-- このリポジトリ（公開）: 二つの層 -->
  <rect x="254" y="16" width="450" height="130" rx="3" fill="#D55E00" fill-opacity="0.07" stroke="#D55E00" stroke-width="1.5"/>
  <text x="270" y="46" font-size="18" font-weight="700" fill="#1E1E1E">二つの層（誰にとっても同じ）</text>
  <text x="270" y="86" font-size="17" fill="#1E1E1E">ronjutsu-seyo</text>
  <text x="404" y="86" font-size="17" fill="#1E1E1E">論述の層：何をどの順で主張するか</text>
  <text x="270" y="118" font-size="17" fill="#1E1E1E">buntai-seyo</text>
  <text x="404" y="118" font-size="17" fill="#1E1E1E">文体の層：語・文・表記</text>
  <!-- chosei-seyo: 会話の指摘 → 案 → 了承 → 登録 -->
  <text x="162" y="213" font-size="17" fill="#1E1E1E">会話で出た指摘</text>
  <path d="M286,207 L318,207" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="320" y="172" width="176" height="70" rx="3" fill="#0072B2" fill-opacity="0.07" stroke="#0072B2" stroke-width="1.5"/>
  <text x="336" y="200" font-size="18" font-weight="700" fill="#1E1E1E">chosei-seyo</text>
  <text x="336" y="228" font-size="17" fill="#1E1E1E">登録の案を示す</text>
  <path d="M496,207 L530,207" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="590" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#1E1E1E">利用者の了承</text>
  <path d="M590,224 L590,380" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="600" y="262" font-size="17" fill="#1E1E1E">登録</text>
  <path d="M102,146 L102,380" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <text x="92" y="222" font-size="17" text-anchor="end" fill="#1E1E1E">② 読む</text>
  <!-- 公開と非公開の境界 -->
  <line x1="8" y1="292" x2="712" y2="292" stroke="#555555" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="346" y="280" font-size="17" text-anchor="middle" fill="#404040">このリポジトリ（公開）</text>
  <text x="346" y="320" font-size="17" text-anchor="middle" fill="#404040">~/.seyo/（利用者の PC。公開しない）</text>
  <!-- ~/.seyo/（公開しない）: 利用者の指摘の図鑑 -->
  <rect x="16" y="338" width="688" height="116" rx="3" fill="none" stroke="#009E73" stroke-width="1.5"/>
  <text x="346" y="366" font-size="18" font-weight="700" text-anchor="middle" fill="#1E1E1E">利用者の指摘の図鑑</text>
  <rect x="28" y="382" width="148" height="56" rx="3" fill="#009E73" fill-opacity="0.07" stroke="#009E73" stroke-width="1.5"/>
  <text x="102.0" y="416" font-size="17" text-anchor="middle" fill="#1E1E1E">共通</text>
  <rect x="224" y="382" width="216" height="56" rx="3" fill="#009E73" fill-opacity="0.07" stroke="#009E73" stroke-width="1.5"/>
  <text x="332.0" y="416" font-size="17" text-anchor="middle" fill="#1E1E1E">引き継ぐプロジェクト</text>
  <rect x="488" y="382" width="204" height="56" rx="3" fill="#009E73" fill-opacity="0.07" stroke="#009E73" stroke-width="1.5"/>
  <text x="590.0" y="416" font-size="17" text-anchor="middle" fill="#1E1E1E">いまのプロジェクト</text>
  <path d="M176,410 L222,410" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M440,410 L486,410" fill="none" stroke="#555555" stroke-width="2" marker-end="url(#ah)"/>
</svg>
